<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>loading</title>
    <style>
      html,
      body {
        margin: 0;
        background: #2a2018;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #err {
        position: absolute;
        color: #fff;
        font: 16px monospace;
        padding: 8px;
      }
    </style>
    <script>
      window.addEventListener(
        "error",
        function (e) {
          document.title =
            "ERR:" + (e.message || e.filename + ":" + e.lineno);
        },
        true
      );
      window.addEventListener("unhandledrejection", function (e) {
        document.title =
          "REJ:" + ((e.reason && e.reason.message) || String(e.reason));
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="err"></div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      document.title = "MODULE_OK";
      const MUVA_BG = "#2a2018";
      const params = new URLSearchParams(location.search);
      const modelUrl =
        params.get("m") ||
        "/public/models/sculptures/Santo_de_pie_sosteniendo_un_libro_abierto.glb";
      const variant = params.get("v") || "current";

      // Mismos valores que SculptureViewer.tsx (o la variante probada)
      const LIGHTS = {
        current: {
          exposure: 1.4,
          ambient: 1.35,
          key: 2.6,
          fill: 1.15,
          back: 0.85,
          spot: 1.55,
          hemi: 1.0,
          metal: "keep",
          rough: "keep",
        },
        prev: {
          exposure: 1.15,
          ambient: 1.0,
          key: 2.2,
          fill: 0.9,
          back: 0.6,
          spot: 1.3,
          hemi: 0.8,
          metal: "keep",
          rough: "keep",
        },
        metal0: {
          exposure: 1.4,
          ambient: 1.35,
          key: 2.6,
          fill: 1.15,
          back: 0.85,
          spot: 1.55,
          hemi: 1.0,
          metal: 0,
          rough: 0.85,
        },
        prevMetal0: {
          exposure: 1.15,
          ambient: 1.0,
          key: 2.2,
          fill: 0.9,
          back: 0.6,
          spot: 1.3,
          hemi: 0.8,
          metal: 0,
          rough: 0.85,
        },
      };
      const cfg = LIGHTS[variant] || LIGHTS.current;

      const W = window.innerWidth;
      const H = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.setClearColor(new THREE.Color(MUVA_BG));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = cfg.exposure;
      document.body.appendChild(renderer.domElement);
      document.title = "GL_OK";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(MUVA_BG);
      scene.fog = new THREE.Fog(MUVA_BG, 8, 18);

      const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
      const dir = new THREE.Vector3(3.5, 2.2, 4.5).normalize();
      camera.position.copy(dir.multiplyScalar(4.11));
      camera.lookAt(0, 0, 0);

      scene.add(new THREE.AmbientLight(0xe8dcc4, cfg.ambient));
      const key = new THREE.DirectionalLight(0xf5ecda, cfg.key);
      key.position.set(5, 6, 5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xc9b89a, cfg.fill);
      fill.position.set(-4, 3, -3);
      scene.add(fill);
      const back = new THREE.DirectionalLight(0xfff2df, cfg.back);
      back.position.set(0, 2, 8);
      scene.add(back);
      const spot = new THREE.SpotLight(0xfdfaf3, cfg.spot, 0, 0.6, 0.7);
      spot.position.set(0, 6, 0);
      scene.add(spot);
      const hemi = new THREE.HemisphereLight(0xf5ecda, 0x3d2f22, cfg.hemi);
      scene.add(hemi);

      const draco = new DRACOLoader().setDecoderPath("/public/draco/");
      const loader = new GLTFLoader().setDRACOLoader(draco);
      document.title = "LOAD_START";

      loader.load(
        modelUrl,
        (gltf) => {
          document.title = "PARSED:" + modelUrl.split("/").pop();
          const obj = gltf.scene;
          obj.traverse((o) => {
            if (o.isMesh && o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              for (const m of mats) {
                if (typeof cfg.metal === "number") m.metalness = cfg.metal;
                if (typeof cfg.rough === "number") m.roughness = cfg.rough;
                m.needsUpdate = true;
              }
            }
          });

          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);
          const maxDim = Math.max(size.x, size.y, size.z);
          const s = maxDim > 0 ? 2.4 / maxDim : 1;
          obj.scale.setScalar(s);
          obj.position.set(-center.x * s, -center.y * s, -center.z * s);
          scene.add(obj);

          renderer.render(scene, camera);
          document.title = "READY:" + modelUrl.split("/").pop();
        },
        (ev) => {
          if (ev.total) document.title = "FETCH:" + Math.round((100 * ev.loaded) / ev.total);
        },
        (e) => {
          document.getElementById("err").textContent = "ERROR " + e.message;
          document.title = "ERROR";
        }
      );
    </script>
  </body>
</html>
